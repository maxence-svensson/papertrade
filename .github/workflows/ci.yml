name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: papertrade
          POSTGRES_PASSWORD: papertrade
          POSTGRES_DB: papertrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U papertrade"
          --health-interval 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://papertrade:papertrade@localhost:5432/papertrade
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production-0123456789

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npx next build
