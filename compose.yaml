# Base de données locale pour le développement : `docker compose up -d`
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: papertrade
      POSTGRES_PASSWORD: papertrade
      POSTGRES_DB: papertrade
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrade"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
